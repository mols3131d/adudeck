name: Deck Calibration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deck-calibration.yml"
      - "decks/data_engineering-apache_airflow/**"

permissions:
  contents: read

concurrency:
  group: deck-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airflow-recovery:
    name: Airflow same-run recovery evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true

      - name: Run scheduler-backed clear and re-run experiment
        working-directory: decks/data_engineering-apache_airflow
        run: |
          set -euo pipefail

          bash lab/scripts/reset.sh --all
          bash lab/scripts/preflight.sh
          bash lab/airflow.sh db migrate
          bash lab/airflow.sh dags list --local -o json >/tmp/local-dags.json
          grep -Fq 'adudeck_observable_runtime' /tmp/local-dags.json

          standalone_log="${RUNNER_TEMP}/airflow-standalone.log"
          bash lab/airflow.sh standalone >"$standalone_log" 2>&1 &
          airflow_pid=$!

          cleanup() {
            kill "$airflow_pid" 2>/dev/null || true
            wait "$airflow_pid" 2>/dev/null || true
            echo "== standalone log tail =="
            tail -n 100 "$standalone_log" || true
          }
          trap cleanup EXIT

          dag_ready=false
          for _ in $(seq 1 60); do
            if ! kill -0 "$airflow_pid" 2>/dev/null; then
              echo "standalone exited before DagModel became available" >&2
              exit 1
            fi
            if python - <<'PY'
          import sqlite3
          db = sqlite3.connect('lab/.airflow/airflow.db')
          row = db.execute(
              'SELECT 1 FROM dag WHERE dag_id=? LIMIT 1',
              ('adudeck_observable_runtime',),
          ).fetchone()
          raise SystemExit(0 if row else 1)
          PY
            then
              dag_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$dag_ready" != true ]]; then
            echo "Dag Processor did not create the expected DagModel" >&2
            exit 1
          fi

          bash lab/airflow.sh dags unpause adudeck_observable_runtime

          run_id="adudeck_calibration_${GITHUB_RUN_ID}"
          logical_date="2026-08-27T00:00:00+00:00"
          export RUN_ID_FOR_PROBE="$run_id"

          bash lab/airflow.sh dags trigger \
            -r "$run_id" \
            -l "$logical_date" \
            -c '{"failure_mode":"none"}' \
            adudeck_observable_runtime

          wait_for_transform_success() {
            local previous_end="${1:-}"
            for _ in $(seq 1 90); do
              current="$(python - <<'PY'
          import os, sqlite3
          db = sqlite3.connect('lab/.airflow/airflow.db')
          row = db.execute(
              "SELECT state, end_date FROM task_instance WHERE dag_id=? AND run_id=? AND task_id='transform'",
              ('adudeck_observable_runtime', os.environ['RUN_ID_FOR_PROBE']),
          ).fetchone()
          print('|'.join('' if value is None else str(value) for value in row) if row else '|')
          PY
              )"
              state="${current%%|*}"
              end_date="${current#*|}"
              if [[ "$state" == "success" && -n "$end_date" && "$end_date" != "$previous_end" ]]; then
                printf '%s\n' "$end_date"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          before_end="$(wait_for_transform_success)"

          python - <<'PY'
          import os, sqlite3
          db = sqlite3.connect('lab/.airflow/airflow.db')
          row = db.execute(
              'SELECT run_id, logical_date FROM dag_run WHERE dag_id=? AND run_id=?',
              ('adudeck_observable_runtime', os.environ['RUN_ID_FOR_PROBE']),
          ).fetchone()
          assert row and row[0] == os.environ['RUN_ID_FOR_PROBE'], row
          assert row[1] is not None and row[1].startswith('2026-08-27'), row
          print(f'validated run identity: {row}')
          PY

          bash lab/airflow.sh tasks clear \
            adudeck_observable_runtime \
            -s "$logical_date" \
            -e "$logical_date" \
            -t 'transform' \
            -y

          python - <<'PY'
          import os, sqlite3
          db = sqlite3.connect('lab/.airflow/airflow.db')
          row = db.execute(
              "SELECT state FROM task_instance WHERE dag_id=? AND run_id=? AND task_id='transform'",
              ('adudeck_observable_runtime', os.environ['RUN_ID_FOR_PROBE']),
          ).fetchone()
          assert row and row[0] is None, row
          print('validated clear state reset for transform')
          PY

          after_end="$(wait_for_transform_success "$before_end")"
          test "$after_end" != "$before_end"

          python - <<'PY'
          import os, sqlite3
          db = sqlite3.connect('lab/.airflow/airflow.db')
          rows = db.execute(
              'SELECT task_id, state FROM task_instance WHERE dag_id=? AND run_id=? ORDER BY task_id',
              ('adudeck_observable_runtime', os.environ['RUN_ID_FOR_PROBE']),
          ).fetchall()
          print(rows)
          assert dict(rows) == {'prepare': 'success', 'publish': 'success', 'transform': 'success'}, rows
          PY

          test -f "lab/output/${run_id}-published.json"
          echo "same-run recovery validated: $run_id transform $before_end -> $after_end"
