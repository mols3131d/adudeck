name: CI

on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      tree_sha: ${{ steps.patch.outputs.tree_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true

      - name: Run cheap deterministic validation
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run ci:fast

      - name: Build validated tree patch
        id: patch
        run: |
          git add -A
          echo "tree_sha=$(git write-tree)" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary > autofix.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload auto-fix patch
        if: ${{ steps.patch.outputs.changed == 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autofix-${{ github.run_id }}
          path: autofix.patch
          if-no-files-found: error
          retention-days: 1

  persist:
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      head_sha: ${{ steps.commit.outputs.head_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-${{ github.run_id }}

      - name: Apply validated tree
        env:
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree_sha }}
        run: |
          git apply --index --binary autofix.patch
          git diff --cached --check
          actual_tree="$(git write-tree)"
          if [ "$actual_tree" != "$EXPECTED_TREE" ]; then
            echo "Expected validated tree $EXPECTED_TREE, got $actual_tree"
            exit 1
          fi

      - name: Commit and push auto-fixes
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: auto-fix"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  status:
    needs: [prepare, persist]
    if: ${{ always() }}
    permissions:
      statuses: write
    runs-on: ubuntu-slim
    timeout-minutes: 1

    steps:
      - name: Publish latest-head validation status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.persist.outputs.head_sha || github.sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PERSIST_RESULT: ${{ needs.persist.result }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          WRITABLE_PUSH: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PREPARE_RESULT" = "success" ] && \
             { [ "$CHANGED" != "true" ] || { [ "$WRITABLE_PUSH" = "true" ] && [ "$PERSIST_RESULT" = "success" ]; }; }; then
            state="success"
            description="Validated repository tree passed"
          else
            state="failure"
            description="CI validation failed; inspect the workflow run"
          fi

          payload=$(printf '{"state":"%s","context":"ci/validated","description":"%s","target_url":"%s"}' \
            "$state" "$description" "$RUN_URL")

          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -d "$payload"
