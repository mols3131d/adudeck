name: CI

on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 100
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true

      - name: Resolve verification scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || [ "$REF_NAME" = "refs/heads/main" ]; then
            scope_output="$(printf 'test_targets=all\notel_acceptance=true\nscope_reason=full verification (%s on %s)\n' "$EVENT_NAME" "$REF_NAME")"
          elif git fetch --no-tags --depth=100 origin "+refs/heads/main:refs/remotes/origin/main" 2>/dev/null; then
            scope_output="$(bash scripts/test.sh --ci-scope origin/main)"
          else
            scope_output="$(printf 'test_targets=all\notel_acceptance=true\nscope_reason=origin/main fetch failed (fail-safe full scope)\n')"
          fi
          printf '%s\n' "$scope_output"
          printf '%s\n' "$scope_output" >> "$GITHUB_OUTPUT"

      - name: Run cheap deterministic validation
        env:
          MISE_GITHUB_TOKEN: ""
          CI_TEST_TARGETS: ${{ steps.scope.outputs.test_targets }}
        run: mise run ci:fast

      - name: Run OpenTelemetry external runtime acceptance
        if: ${{ steps.scope.outputs.otel_acceptance == 'true' }}
        run: mise run test:opentelemetry-acceptance

      - name: Verify tracked source unchanged
        run: git diff --exit-code

  status:
    needs: prepare
    if: ${{ !cancelled() }}
    permissions:
      statuses: write
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Publish latest-head validation status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PREPARE_RESULT" = "success" ]; then
            state="success"
            description="Validated repository tree passed"
          else
            state="failure"
            description="CI validation failed; inspect the workflow run"
          fi
          payload=$(printf '{"state":"%s","context":"ci/validated","description":"%s","target_url":"%s"}' \
            "$state" "$description" "$RUN_URL")
          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -d "$payload"
