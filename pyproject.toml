[project]
name = "adudeck"
version = "0.1.0"
description = "Agentic Education Deck workspace."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.ruff]
target-version = "py310"
src = [".", "scripts"]
extend-exclude = ["decks/_archive", "*.md"]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.src]
exclude = [
  "decks/_archive",
  "decks/ai-langchain",
  "decks/ai-openai_sdk",
  "decks/data_engineering-apache_airflow/lab/dags",
  "decks/llmops-langfuse",
  "decks/systems-opentelemetry",
  "tools/dataset_generator",
]
