[project]
name = "adudeck-ai-langchain"
version = "0.1.0"
description = "LangChain Python fundamentals and executable agent learning labs."
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
  "langchain>=1.5.2,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
live = [
  "langchain-openai>=1.8.2,<2",
]

[[tool.ty.overrides]]
include = ["playground/05-live-provider/live_agent.py"]

[tool.ty.overrides.rules]
import-not-found = "ignore"
