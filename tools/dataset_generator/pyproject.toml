[project]
name = "adudeck-data"
version = "0.1.0"
description = "Reproducible learning datasets for adudeck"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["Faker==40.37.0"]

[project.scripts]
adudeck-data = "adudeck_data.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adudeck_data"]
