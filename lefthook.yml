glob_matcher: doublestar

pre-commit:
  jobs:
    - group:
        piped: true
        jobs:
          - name: markdown
            glob: "**/*.md"
            exclude:
              - ".agents/**"
              - ".github/copilot-instructions.md"
              - ".github/instructions/**"
              - ".github/skills/**"
              - "AGENTS.md"
              - "decks/**/AGENTS.md"
            run: rumdl fmt {staged_files}
            stage_fixed: true

          - name: json
            glob: "**/*.{json,jsonc}"
            run: biome format --write {staged_files}
            stage_fixed: true

          - name: toml
            glob: "**/*.toml"
            run: tombi format {staged_files}
            stage_fixed: true

          - name: agentsmesh
            glob:
              - ".agentsmesh/**"
              - "agentsmesh.yaml"
            exclude:
              - ".agentsmesh/packs/**"
            run: agentsmesh lint
