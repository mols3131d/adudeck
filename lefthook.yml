glob_matcher: doublestar

pre-commit:
  jobs:
    - group:
        piped: true
        jobs:
          - name: markdown
            glob: "**/*.md"
            exclude:
              - ".agents/**"
              - ".claude/**"
              - ".codex/**"
              - ".copilot/**"
              - ".github/copilot-instructions.md"
              - ".github/agents/**"
              - ".github/instructions/**"
              - ".github/prompts/**"
              - ".github/skills/**"
              - ".rulesync/*/.curated/**"
              - "AGENTS.md"
              - "**/AGENTS.md"
              - "AGENTS.override.md"
              - "**/AGENTS.override.md"
              - "decks/_archive/**"
            run: rumdl fmt {staged_files}
            stage_fixed: true

          - name: python
            glob: "**/*.py"
            exclude:
              - "decks/_archive/**"
            run: ruff check --fix {staged_files} && ruff format {staged_files}
            stage_fixed: true

          - name: json
            glob: "**/*.{json,jsonc}"
            run: biome format --write {staged_files}
            stage_fixed: true

          - name: toml
            glob: "**/*.toml"
            run: tombi format {staged_files}
            stage_fixed: true

          - name: rulesync
            glob:
              - ".rulesync/**"
              - "rulesync.jsonc"
            run: rulesync doctor --strict
