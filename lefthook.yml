glob_matcher: doublestar

pre-commit:
  jobs:
    - group:
        piped: true
        jobs:
          - name: markdown
            glob: "**/*.md"
            exclude:
              - ".agents/**"
              - ".github/copilot-instructions.md"
              - ".github/instructions/**"
              - "AGENTS.md"
              - "decks/**/AGENTS.md"
            run: rumdl fmt {staged_files}
            stage_fixed: true

          - name: json
            glob: "**/*.{json,jsonc}"
            run: biome format --write {staged_files}
            stage_fixed: true

          - name: toml
            glob: "**/*.toml"
            run: tombi format {staged_files}
            stage_fixed: true

          - name: agentsmesh
            glob:
              - ".agentsmesh/**"
              - "agentsmesh.yaml"
            exclude:
              - ".agentsmesh/.lock"
              - ".agentsmesh/packs/**"
            run: |
              list_outputs() {
                awk '
                  /^outputs:$/ { outputs = 1; next }
                  outputs && /^[^ ]/ { exit }
                  outputs && /^  / {
                    line = $0
                    sub(/^  /, "", line)
                    sub(/: sha256:.*/, "", line)
                    print line
                  }
                ' .agentsmesh/.lock
              }
              before_outputs="$(list_outputs)"
              agentsmesh generate
              after_outputs="$(list_outputs)"
              printf '%s\n%s\n' "$before_outputs" "$after_outputs" |
                sed '/^$/d' |
                sort -u |
                while IFS= read -r path; do
                  git add -A -- "$path"
                done
              git add -- .agentsmesh/.lock
