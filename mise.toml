[tools]
python = "3.14.10"
uv = "0.13.7"
"github:dyoshikawa/rulesync" = "latest"
biome = "2.6.5"
tombi = "1.10.0"
rumdl = "0.3.2"
lefthook = "2.2.2"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
python.uv_venv_auto = "source"

[tasks."rulesync:doctor"]
description = "Validate Rulesync configuration"
run = "rulesync doctor --strict"

[tasks."rulesync:install"]
description = "Resolve external Rulesync dependencies"
run = "rulesync install"

[tasks."rulesync:generate"]
description = "Generate agent projections from canonical Rulesync assets"
run = """
rulesync install --frozen
rulesync generate
rulesync generate --targets agentsmd,copilot --features rules
sh .rulesync/scripts/project-root-agents.sh
"""

[tasks."rulesync:check"]
description = "Check frozen Skills, Copilot Rules, and the root AGENTS.md projection"
run = """
rulesync install --frozen
rulesync generate --check
rulesync generate --check --targets copilot --features rules
sh .rulesync/scripts/project-root-agents.sh --check
"""

[tasks."chatbot:check"]
description = "Check chatbot routing metadata"
run = '''
rulesync install --frozen
uv run python .rulesync/skills/.curated/mols-chatbot-bootstrap/scripts/generate_routes.py --repo . --skills-root .rulesync/skills --output-dir .agents/route --kinds both --check
uv run python -c "import json,pathlib; d=json.load(open('rulesync.lock'))['sources']['mols3131d/mols-agent-assets']; e={r['name']:r['source'] for r in map(json.loads,pathlib.Path('.agents/route/skills.jsonl').read_text().splitlines()[1:]) if r['source'].startswith('https://raw.githubusercontent.com/mols3131d/mols-agent-assets/')}; assert set(e)==set(d['skills']) and all('/'+d['resolvedRef']+'/' in s and s.endswith('/skills/'+n+'/SKILL.md') for n,s in e.items())"
'''

[tasks.format]
description = "Auto-format repository-owned text formats"
run = "bash scripts/format.sh"

[tasks."format:check"]
description = "Check repository-owned text formatting without writing"
run = "bash scripts/format.sh --check"

[tasks."test:opentelemetry-acceptance"]
description = "Run Flask zero-code and OTLP/Collector end-to-end textbook acceptance"
run = "bash scripts/test.sh opentelemetry-acceptance"

[tasks.test]
description = "Run repository tests (default: all; or target name)"
run = "bash scripts/test.sh"

[tasks.setup]
description = "Set up the local workspace"
run = "bash scripts/setup.sh"

[tasks.update]
description = "Update toolchain, dependencies, and agent projections"
run = "bash scripts/update.sh"

[tasks."ci:fast"]
description = "Auto-fix and run cheap deterministic PR validation"
run = """
uv sync --locked
mise run format
lefthook validate
mise run rulesync:doctor
mise run rulesync:generate
mise run rulesync:check
mise run chatbot:check
mise run test
"""
